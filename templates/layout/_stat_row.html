<div class="row">
  <div class="col-6 col-xl-3 mb-3"><div class="stat-card"><div class="ic ic-info"><i class="fas fa-clipboard-list"></i></div><div><b>{{ requestmade }}</b><small>Requests made</small></div></div></div>
  <div class="col-6 col-xl-3 mb-3"><div class="stat-card"><div class="ic ic-warn"><i class="fas fa-hourglass-half"></i></div><div><b>{{ requestpending }}</b><small>Pending</small></div></div></div>
  <div class="col-6 col-xl-3 mb-3"><div class="stat-card"><div class="ic ic-ok"><i class="fas fa-check-circle"></i></div><div><b>{{ requestapproved }}</b><small>Approved</small></div></div></div>
  <div class="col-6 col-xl-3 mb-3"><div class="stat-card"><div class="ic ic-red"><i class="fas fa-times-circle"></i></div><div><b>{{ requestrejected }}</b><small>Rejected</small></div></div></div>
</div>
