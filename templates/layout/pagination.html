{% if page.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-between align-items-center p-3 border-top flex-wrap" style="gap:.5rem">
  <small class="text-muted">Showing {{ page.start_index }}-{{ page.end_index }} of {{ page.paginator.count }}</small>
  <ul class="pagination mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{k}}={{v|urlencode}}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">&laquo;</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{k}}={{v|urlencode}}&{% endif %}{% endfor %}page={{ page.next_page_number }}">&raquo;</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
